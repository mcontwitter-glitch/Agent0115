<script>
/* ==========================================================================
   SnowCraft  -  BIG ENTERTAINMENT
   A tribute to the classic 1999 "SnowCraft" holiday snowball-fight game.
   Single file, no external assets. Everything is drawn in code (canvas gradients).

   HOW TO PLAY (as in the original):
     * You are the RED team (bottom-right), played by three Lil Foots NFTs
       (Green Crown, Hard Hat, Christ Is King beanie). The GREEN kids (top-left) attack you.
     * Press & HOLD on one of your red kids: he packs a snowball and the green power
       bar beside him fills. Drag while holding to move him around your side.
       RELEASE to throw across the diagonal. Longer hold = farther throw.
     * Tap / click on the snow to walk the selected kid there.
     * A kid hit once is knocked down for a moment; hit twice he is out.
     * Knock out every green kid to reach the next level. More green kids every level.
     * Game over when all three of your kids are out.
     * POWER-UP: 10 hits in a row gives the lil foot who threw the 10th a 5-second
       power-up: 3x faster wind-up and big snowballs that knock out in one hit.
       A miss (snowball hits the snow or a fort) resets the streak.

   SKINS (default player skin is 'lilfoots' = one NFT image per kid, see SKINS.lilfoots.roster):
       SnowCraft.setSkin('player', 'red' | 'green' | skinObject)
       SnowCraft.setSkin('enemy',  ...)
     A skin object can recolour the built-in kid:
       { suit:'#d81e1e', boots:'#2b33b8', mitten:'#c01818', face:'#f6dcc0', pants:'#2b33b8' }
     or supply image sprites per pose (anchored bottom-centre on the kid's feet):
       { sprites:{ stand:'foot.png', walk:'foot_walk.png', charge:'foot_throw.png',
                   throw:'foot_throw2.png', sit:'foot_sit.png', down:'foot_ko.png' },
         spriteHeight: 30 }
     Missing poses fall back to 'stand', then to the built-in drawn kid.
   ========================================================================== */
(() => {
'use strict';

const W = 640, H = 360;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let DPR = 1;

// ---------------------------------------------------------------- skins
const SKINS = {
  red:   { label:'Red Team',   suit:'#d71c1c', mitten:'#c41616', boots:'#2a34b8', pants:'#2a34b8', face:'#f6dcc4' },
  green: { label:'Green Team', suit:'#1f9a2b', mitten:'#1f9a2b', boots:'#2a34b8', pants:'#3341c4', face:'#f6dcc4' },
};
// Which skin each side uses. Swap with SnowCraft.setSkin(team, skinKeyOrObject).
const LF = window.LILFOOT_IMG || {};
const LF_BASE = { spriteHeight: 58, suit:'#d71c1c', mitten:'#c41616', boots:'#2a34b8', pants:'#2a34b8', face:'#f6dcc4' };
SKINS.lf_crown   = { ...LF_BASE, label:'Lil Foot - Green Crown', sprites:{ stand: LF.crown } };
SKINS.lf_hardhat = { ...LF_BASE, label:'Lil Foot - Hard Hat',    sprites:{ stand: LF.hardhat } };
SKINS.lf_beanie  = { ...LF_BASE, label:'Lil Foot - Christ Is King', sprites:{ stand: LF.beanie } };
// A "roster" skin gives each kid on the team his own skin (kid 0, 1, 2 ...).
SKINS.lilfoots   = { label:'Lil Foots', roster:['lf_crown', 'lf_hardhat', 'lf_beanie'] };
const TEAMS = { player:'lilfoots', enemy:'green' };
const POSES = ['stand', 'walk', 'charge', 'throw', 'sit', 'down'];

function resolveSkin(s) { return (typeof s === 'string' ? SKINS[s] : s) || SKINS.red; }
function kidSkin(k) { const t = resolveSkin(TEAMS[k.team]); return t.roster ? resolveSkin(t.roster[(k.slot || 0) % t.roster.length]) : t; }
function spriteReady(skin) { if (!skin.sprites) return null; const im = loadImage(skin.sprites.stand); return im && im.complete !== false && (im.naturalWidth || im.width) ? im : null; }
function kidH(k) { const sk = kidSkin(k); return spriteReady(sk) ? (sk.spriteHeight || 30) : 33; }
const imageCache = new Map();
function loadImage(src) {
  if (typeof src !== 'string') return src;
  if (!imageCache.has(src)) { const im = new Image(); im.src = src; imageCache.set(src, im); }
  return imageCache.get(src);
}

// colour helpers
function hexRgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mix(hex, t) { // t>0 lighten toward white, t<0 darken toward black
  const [r, g, b] = hexRgb(hex);
  const f = c => Math.round(t >= 0 ? c + (255 - c) * t : c * (1 + t));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
const gradCache = new Map();
function ball3d(x, y, r, col, lx = -0.38, ly = -0.42) { // shaded sphere / ellipse fill style
  const g = ctx.createRadialGradient(x + r * lx, y + r * ly, r * 0.08, x, y, r * 1.08);
  g.addColorStop(0, mix(col, 0.55)); g.addColorStop(0.35, mix(col, 0.12));
  g.addColorStop(0.8, mix(col, -0.28)); g.addColorStop(1, mix(col, -0.5));
  return g;
}
function ell(x, y, rx, ry, rot, fill) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }

// ---------------------------------------------------------------- utils
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const KS = 1.15;                                  // kid draw scale
const diagV = (x, y) => x / W + y / H;           // 0 = top-left corner, 2 = bottom-right corner
let uid = 1;

// ---------------------------------------------------------------- sound (tiny WebAudio)
let AC = null;
function audio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = false; } }
  if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function noise(dur, f0, f1, vol) {
  const a = AC; if (!a) return;
  try {
    const n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = a.createBufferSource(); s.buffer = buf;
    const f = a.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2;
    f.frequency.setValueAtTime(f0, a.currentTime); f.frequency.exponentialRampToValueAtTime(f1, a.currentTime + dur);
    const g = a.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(a.destination); s.start();
  } catch (e) {}
}
const sfx = { throw() { noise(0.18, 1800, 600, 0.12); }, hit() { noise(0.16, 500, 150, 0.35); }, splat() { noise(0.1, 900, 300, 0.08); } };

// ---------------------------------------------------------------- background (soft shaded snowfield)
const bg = document.createElement('canvas');
function buildBackground() {
  const s = 2; bg.width = W * s; bg.height = H * s;
  const b = bg.getContext('2d'); b.scale(s, s);
  b.fillStyle = '#ffffff'; b.fillRect(0, 0, W, H);
  let g = b.createRadialGradient(W * 0.47, H * 0.42, 60, W * 0.5, H * 0.45, W * 0.66);
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.55, 'rgba(236,242,249,0.55)');
  g.addColorStop(0.82, 'rgba(206,220,236,0.9)'); g.addColorStop(1, 'rgba(176,195,218,1)');
  b.fillStyle = g; b.fillRect(0, 0, W, H);
  // cooler shading in the bottom corners and along the top edge, like the original
  g = b.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'rgba(190,206,226,0.35)'); g.addColorStop(0.12, 'rgba(255,255,255,0)');
  g.addColorStop(0.8, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(165,186,214,0.6)');
  b.fillStyle = g; b.fillRect(0, 0, W, H);
  // faint drifts
  for (let i = 0; i < 14; i++) {
    const x = rand(0, W), y = rand(0, H), r = rand(40, 110);
    const dg = b.createRadialGradient(x, y, 2, x, y, r);
    dg.addColorStop(0, 'rgba(255,255,255,0.5)'); dg.addColorStop(1, 'rgba(255,255,255,0)');
    b.fillStyle = dg; b.beginPath(); b.ellipse(x, y, r, r * 0.45, 0, 0, Math.PI * 2); b.fill();
  }
}

// ---------------------------------------------------------------- forts (crescent snow walls)
// Each fort is a thick, smooth horseshoe of packed snow, convex side facing the enemy.
const FORT_DEFS = [
  { cx: 192, cy: 114, rx: 42, ry: 21, a0: 168, a1: -20, owner: 'enemy' },   // green fort, opens up (towards greens)
  { cx: 434, cy: 238, rx: 42, ry: 21, a0: 192, a1: 380, owner: 'player' },  // red fort, opens down (towards reds)
];
let forts = [];

// ---------------------------------------------------------------- input (mouse + touch via pointer events)
function toLogical(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }
function kidAt(x, y, touch) {
  let bestK = null, bd0 = touch ? 26 : 17;
  players().forEach(k => { if (!usable(k)) return; const h = kidH(k), bd = h > 40 ? bd0 + 8 : bd0;
    const d = Math.hypot(k.x - x, (k.y - h * 0.42) - y); if (d < bd && (!bestK || d < bestK.d)) { bestK = { k, d }; } });
  return bestK && bestK.k;
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audio();
  const [x, y] = toLogical(e); pointer.x = x; pointer.y = y; pointer.touch = e.pointerType === 'touch';
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  if (state === 'title') { startGame(); return; }
  if (state === 'over') { if (stateT > 0.6) fadeTo(() => { level = 1; score = 0; setupLevel(1); setState('play'); bannerText = 'Level 1'; bannerT = 2; }); return; }
  if (state !== 'play') return;
  const k = kidAt(x, y, pointer.touch);
  if (k) { selected = k; drag = { k, id: e.pointerId, sx: x, sy: y, moved: false }; k.state = 'charge'; k.power = 0; k.tx = null; return; }
  if (selected && usable(selected)) { [selected.tx, selected.ty] = clampZone('player', x, y); if (selected.state === 'idle') selected.state = 'walk'; }
});
cv.addEventListener('pointermove', e => {
  const [x, y] = toLogical(e); pointer.x = x; pointer.y = y;
  if (state === 'play') cv.style.cursor = kidAt(x, y, false) || drag ? 'pointer' : 'default';
  if (!drag || drag.id !== e.pointerId) return;
  if (!drag.moved && Math.hypot(x - drag.sx, y - drag.sy) > 6) drag.moved = true;
  if (drag.moved) { [drag.k.tx, drag.k.ty] = clampZone('player', x, y + kidH(drag.k) * 0.42); }
});
function release(e) {
  if (!drag || drag.id !== e.pointerId) return;
  const k = drag.k; drag = null;
  if (k.state === 'charge') { throwBall(k, k.power); k.state = 'throw'; k.t = 0.28; k.tx = null; }
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
cv.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

// ---------------------------------------------------------------- layout
function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const s = Math.min(vw / W, vh / H);
  const cw = Math.floor(W * s), ch = Math.floor(H * s);
  DPR = Math.min(3, (window.devicePixelRatio || 1) * s);
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  DPR = cv.width / W;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);

// ---------------------------------------------------------------- loop
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render();
  requestAnimationFrame(frame);
}
buildBackground(); buildForts(); resize();
if (document.fonts) ['400 10px Outfit','600 10px Outfit','700 10px Outfit','800 30px Outfit'].forEach(f => { try { document.fonts.load(f); } catch (_) {} });
setupLevel(1);                      // kids walk in behind the title, like the original
requestAnimationFrame(frame);

// ---------------------------------------------------------------- public API (skins / testing)
window.SnowCraft = {
  SKINS, TEAMS, POSES,
  /** setSkin('player'|'enemy', 'lilfoots' | 'red' | 'green' | 'lf_crown' | skinObject). Default player skin is 'lilfoots' (one NFT per kid). */
  setSkin(team, skin) {
    if (typeof skin === 'object') { const key = skin.key || ('custom_' + team); SKINS[key] = { ...(resolveSkin(TEAMS[team]).roster ? LF_BASE : SKINS[TEAMS[team]]), ...skin }; skin = key; }
    if (!SKINS[skin]) throw new Error('Unknown skin ' + skin);
    TEAMS[team] = skin;
  },
  get state() { return { state, level, score, best, streak, kids: kids.map(k => ({ id: k.id, team: k.team, skin: k.team === 'player' ? (resolveSkin(TEAMS.player).roster ? resolveSkin(TEAMS.player).roster[k.slot % 3] : TEAMS.player) : TEAMS.enemy, x: k.x, y: k.y, h: kidH(k), state: k.state, hits: k.hits, powerT: k.powerT })), balls: balls.length, enemyQueue }; },
  debug: {
    start: startGame,
    level(n) { level = n; score = 0; setupLevel(n); setState('play'); },
    koEnemies() { enemyQueue = 0; enemies().forEach(k => alive(k) && ko(k)); },
    koPlayers() { players().forEach(k => alive(k) && ko(k)); },
    setStreak(n) { streak = n; },
    throwAt(i, x, y) { const k = players()[i]; if (k) throwBall(k, 0, x, y); },
    step(sec) { for (let t = 0; t < sec; t += 1 / 60) update(1 / 60); render(); },
  },
};
})();
</script>
</body>
</html>
