<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#cfdbe8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%23d81e1e%22/%3E%3Ccircle cx=%2210%22 cy=%225%22 r=%221.6%22 fill=%22%23fff%22/%3E%3C/svg%3E">
<title>SnowCraft - BIG ENTERTAINMENT</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#cfdbe8;overflow:hidden;
    overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}
  body{display:flex;align-items:center;justify-content:center;}
  #game{display:block;touch-action:none;cursor:default;background:#fff;box-shadow:0 2px 18px rgba(40,60,100,.25);}
</style>
</head>
<body>
<canvas id="game" width="640" height="360" aria-label="SnowCraft game"></canvas>
<noscript>SnowCraft needs JavaScript.</noscript>
<script>
/* ==========================================================================
   SnowCraft  -  BIG ENTERTAINMENT
   A tribute to the classic 1999 "SnowCraft" holiday snowball-fight game.
   Single file, no external assets. Everything is drawn in code (canvas gradients).

   HOW TO PLAY (as in the original):
     * You are the RED team (bottom-right). The GREEN kids (top-left) attack you.
     * Press & HOLD on one of your red kids: he packs a snowball and the green power
       bar beside him fills. Drag while holding to move him around your side.
       RELEASE to throw across the diagonal. Longer hold = farther throw.
     * Tap / click on the snow to walk the selected kid there.
     * A kid hit once is knocked down for a moment; hit twice he is out.
     * Knock out every green kid to reach the next level. More green kids every level.
     * Game over when all three of your kids are out.

   SKINS (for future lil foots NFT characters):
       SnowCraft.setSkin('player', 'red' | 'green' | skinObject)
       SnowCraft.setSkin('enemy',  ...)
     A skin object can recolour the built-in kid:
       { suit:'#d81e1e', boots:'#2b33b8', mitten:'#c01818', face:'#f6dcc0', pants:'#2b33b8' }
     or supply image sprites per pose (anchored bottom-centre on the kid's feet):
       { sprites:{ stand:'foot.png', walk:'foot_walk.png', charge:'foot_throw.png',
                   throw:'foot_throw2.png', sit:'foot_sit.png', down:'foot_ko.png' },
         spriteHeight: 30 }
     Missing poses fall back to 'stand', then to the built-in drawn kid.
   ========================================================================== */
(() => {
'use strict';

const W = 640, H = 360;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let DPR = 1;

// ---------------------------------------------------------------- skins
const SKINS = {
  red:   { label:'Red Team',   suit:'#d71c1c', mitten:'#c41616', boots:'#2a34b8', pants:'#2a34b8', face:'#f6dcc4' },
  green: { label:'Green Team', suit:'#1f9a2b', mitten:'#1f9a2b', boots:'#2a34b8', pants:'#3341c4', face:'#f6dcc4' },
};
// Which skin each side uses. Swap with SnowCraft.setSkin(team, skinKeyOrObject).
const TEAMS = { player:'red', enemy:'green' };
const POSES = ['stand', 'walk', 'charge', 'throw', 'sit', 'down'];

function resolveSkin(s) { return (typeof s === 'string' ? SKINS[s] : s) || SKINS.red; }
const imageCache = new Map();
function loadImage(src) {
  if (typeof src !== 'string') return src;
  if (!imageCache.has(src)) { const im = new Image(); im.src = src; imageCache.set(src, im); }
  return imageCache.get(src);
}

// colour helpers
function hexRgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mix(hex, t) { // t>0 lighten toward white, t<0 darken toward black
  const [r, g, b] = hexRgb(hex);
  const f = c => Math.round(t >= 0 ? c + (255 - c) * t : c * (1 + t));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
const gradCache = new Map();
function ball3d(x, y, r, col, lx = -0.38, ly = -0.42) { // shaded sphere / ellipse fill style
  const g = ctx.createRadialGradient(x + r * lx, y + r * ly, r * 0.08, x, y, r * 1.08);
  g.addColorStop(0, mix(col, 0.55)); g.addColorStop(0.35, mix(col, 0.12));
  g.addColorStop(0.8, mix(col, -0.28)); g.addColorStop(1, mix(col, -0.5));
  return g;
}
function ell(x, y, rx, ry, rot, fill) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }

// ---------------------------------------------------------------- utils
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const KS = 1.15;                                  // kid draw scale
const diagV = (x, y) => x / W + y / H;           // 0 = top-left corner, 2 = bottom-right corner
let uid = 1;

// ---------------------------------------------------------------- sound (tiny WebAudio)
let AC = null;
function audio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = false; } }
  if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function noise(dur, f0, f1, vol) {
  const a = AC; if (!a) return;
  try {
    const n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = a.createBufferSource(); s.buffer = buf;
    const f = a.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2;
    f.frequency.setValueAtTime(f0, a.currentTime); f.frequency.exponentialRampToValueAtTime(f1, a.currentTime + dur);
    const g = a.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(a.destination); s.start();
  } catch (e) {}
}
const sfx = { throw() { noise(0.18, 1800, 600, 0.12); }, hit() { noise(0.16, 500, 150, 0.35); }, splat() { noise(0.1, 900, 300, 0.08); } };

// ---------------------------------------------------------------- background (soft shaded snowfield)
const bg = document.createElement('canvas');
function buildBackground() {
  const s = 2; bg.width = W * s; bg.height = H * s;
  const b = bg.getContext('2d'); b.scale(s, s);
  b.fillStyle = '#ffffff'; b.fillRect(0, 0, W, H);
  let g = b.createRadialGradient(W * 0.47, H * 0.42, 60, W * 0.5, H * 0.45, W * 0.66);
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.55, 'rgba(236,242,249,0.55)');
  g.addColorStop(0.82, 'rgba(206,220,236,0.9)'); g.addColorStop(1, 'rgba(176,195,218,1)');
  b.fillStyle = g; b.fillRect(0, 0, W, H);
  // cooler shading in the bottom corners and along the top edge, like the original
  g = b.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'rgba(190,206,226,0.35)'); g.addColorStop(0.12, 'rgba(255,255,255,0)');
  g.addColorStop(0.8, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(165,186,214,0.6)');
  b.fillStyle = g; b.fillRect(0, 0, W, H);
  // faint drifts
  for (let i = 0; i < 14; i++) {
    const x = rand(0, W), y = rand(0, H), r = rand(40, 110);
    const dg = b.createRadialGradient(x, y, 2, x, y, r);
    dg.addColorStop(0, 'rgba(255,255,255,0.5)'); dg.addColorStop(1, 'rgba(255,255,255,0)');
    b.fillStyle = dg; b.beginPath(); b.ellipse(x, y, r, r * 0.45, 0, 0, Math.PI * 2); b.fill();
  }
}

// ---------------------------------------------------------------- forts (crescent snow walls)
// Each fort is a thick, smooth horseshoe of packed snow, convex side facing the enemy.
const FORT_DEFS = [
  { cx: 192, cy: 110, rx: 37, ry: 19, a0: 168, a1: -20, owner: 'enemy' },   // green fort, opens up (towards greens)
  { cx: 432, cy: 236, rx: 37, ry: 19, a0: 192, a1: 380, owner: 'player' },  // red fort, opens down (towards reds)
];
let forts = [];
function buildForts() {
  forts = FORT_DEFS.map(d => {
    const pts = [], n = 70, ph1 = rand(0, 6), ph2 = rand(0, 6);
    for (let i = 0; i <= n; i++) {
      const u = i / n, a = (d.a0 + (d.a1 - d.a0) * u) * Math.PI / 180;
      const r = 5.5 + 11 * Math.pow(Math.sin(Math.PI * u), 0.6) + 1.3 * Math.sin(u * 11 + ph1) + 0.8 * Math.sin(u * 23 + ph2);
      pts.push({ x: d.cx + Math.cos(a) * d.rx, y: d.cy + Math.sin(a) * d.ry, r: Math.max(3.5, r) });
    }
    const blobs = pts.filter((_, i) => i % 3 === 0);   // coarse list for collisions
    const s = 3, pad = 24;
    const minX = d.cx - d.rx - pad, maxX = d.cx + d.rx + pad + 12, minY = d.cy - d.ry - pad - 12, maxY = d.cy + d.ry + pad;
    const cw = Math.ceil((maxX - minX) * s), ch = Math.ceil((maxY - minY) * s);
    const layer = (fn) => { const c = document.createElement('canvas'); c.width = cw; c.height = ch; const g = c.getContext('2d');
      g.scale(s, s); g.translate(-minX, -minY); fn(g); return c; };
    const dots = (g, col, dx, dy, k, lift) => { g.fillStyle = col; pts.forEach(p => { g.beginPath();
      g.ellipse(p.x + dx, p.y - p.r * lift + dy, p.r * k, p.r * k * 0.9, 0, 0, Math.PI * 2); g.fill(); }); };
    const out = document.createElement('canvas'); out.width = cw; out.height = ch; const o = out.getContext('2d');
    const comp = (c, blur, alpha) => { o.save(); o.globalAlpha = alpha == null ? 1 : alpha; if (blur) o.filter = `blur(${blur * s}px)`; o.drawImage(c, 0, 0); o.restore(); };
    // cast shadow (light from the upper-left)
    comp(layer(g => { g.fillStyle = '#7d92ad'; pts.forEach(p => { g.beginPath(); g.ellipse(p.x + 8, p.y + 1.5, p.r * 1.15, p.r * 0.6, 0, 0, Math.PI * 2); g.fill(); }); }), 3, 0.25);
    // concave inside of the horseshoe
    comp(layer(g => { const hg = g.createRadialGradient(d.cx, d.cy, 2, d.cx, d.cy, d.rx * 0.9);
      hg.addColorStop(0, 'rgba(160,190,222,0.5)'); hg.addColorStop(1, 'rgba(160,190,222,0)');
      g.fillStyle = hg; g.beginPath(); g.ellipse(d.cx, d.cy, d.rx * 0.9, d.ry * 0.9, 0, 0, Math.PI * 2); g.fill(); }), 2);
    comp(layer(g => dots(g, '#6d95c0', 1.4, 1.6, 1.0, 0.45)), 0.4);        // dark rim (shadow side)
    comp(layer(g => dots(g, '#bcd5eb', 0, 0, 0.93, 0.5)), 0.8);            // body
    comp(layer(g => dots(g, '#f2f7fc', -1.8, -1.6, 0.64, 0.62)), 1.6);     // lit top
    comp(layer(g => dots(g, '#ffffff', -2.2, -2, 0.38, 0.8)), 1.4, 0.95);  // highlight
    // a few crumbs of loose snow at the base
    o.save(); o.scale(s, s); o.translate(-minX, -minY);
    for (let i = 0; i < 7; i++) { const p = pts[Math.floor(rand(0, pts.length))];
      const x = p.x + rand(-p.r, p.r), y = p.y + rand(1, 4), r = rand(1, 2.2);
      const gr = o.createRadialGradient(x - r * 0.4, y - r * 0.4, 0.2, x, y, r); gr.addColorStop(0, '#fff'); gr.addColorStop(1, '#9fbfdc');
      o.fillStyle = gr; o.beginPath(); o.arc(x, y, r, 0, Math.PI * 2); o.fill(); }
    o.restore();
    return { ...d, blobs, img: out, ox: minX, oy: minY, s, y: d.cy };
  });
}
function fortBlocks(x, y, z) {
  for (const f of forts) for (const b of f.blobs) {
    const dx = x - b.x, dy = (y - b.y) * 1.6;
    if (dx * dx + dy * dy < b.r * b.r && z < b.r * 1.5) return true;
  }
  return false;
}
function pushOutOfForts(k) {
  for (const f of forts) for (const b of f.blobs) {
    const dx = k.x - b.x, dy = (k.y - b.y) * 1.6, rr = b.r + 4, d = Math.hypot(dx, dy);
    if (d < rr && d > 0.01) { k.x = b.x + dx / d * rr; k.y = b.y + dy / d * rr / 1.6; }
  }
}

// ---------------------------------------------------------------- game state
let state = 'title';          // title | play | clear | lost | over
let stateT = 0, level = 1, score = 0;
let best = +(localStorage.getItem('snowcraft_best') || 0);
let kids = [], balls = [], parts = [], decals = [];
let selected = null, drag = null;
let bannerText = '', bannerT = 0, fade = 0, fadeDir = 0, onFaded = null;
let enemyQueue = 0, spawnT = 0, levelT = 0;
let pointer = { x: -99, y: -99, touch: false };

const players = () => kids.filter(k => k.team === 'player');
const enemies = () => kids.filter(k => k.team === 'enemy');
const alive = k => k.state !== 'down';
const usable = k => k.state !== 'down' && k.state !== 'sit';

function makeKid(team, x, y, tx, ty) {
  return { id: uid++, team, x, y, tx, ty, state: 'walk', hits: 0, power: 0, t: 0, anim: rand(0, 6),
           aiT: rand(1.5, 3), hitT: 0, snowT: 0, jump: 0, aimX: 0, aimY: 0, aimP: 0 };
}

const RED_HOME = [[468, 250], [586, 238], [528, 318]];
const GREEN_HOME = [[86, 58], [190, 52], [70, 114], [130, 152], [250, 40], [40, 190], [140, 92], [205, 170], [22, 62]];

function setupLevel(n) {
  kids = []; balls = []; parts = []; decals = []; selected = null; drag = null; levelT = 0;
  RED_HOME.forEach(([x, y], i) => kids.push(makeKid('player', x + 120 + i * 10, y + 120, x, y)));
  const total = Math.min(2 + n, 9);
  const first = Math.min(3, total);
  for (let i = 0; i < first; i++) { const [x, y] = GREEN_HOME[i]; kids.push(makeKid('enemy', x - 110, y - 90, x, y)); }
  enemyQueue = total - first; spawnT = 5;
  selected = players()[0];
}
function spawnEnemy() {
  const i = Math.floor(rand(0, GREEN_HOME.length)); const [x, y] = GREEN_HOME[i];
  const fromTop = Math.random() < 0.5;
  const k = makeKid('enemy', fromTop ? x + rand(-20, 20) : -20, fromTop ? -20 : y + rand(-20, 20), x + rand(-10, 10), y + rand(-8, 8));
  k.aiT = rand(2, 3.5); kids.push(k);
}

function startGame() {
  audio(); level = 1; score = 0;
  if (state !== 'title') setupLevel(1);
  state = 'play'; stateT = 0; bannerText = ''; bannerT = 0;
}
function setState(s) { state = s; stateT = 0; }
function fadeTo(cb) { fadeDir = 1; onFaded = cb; }

// ---------------------------------------------------------------- zones
function zoneLimit(team) {
  if (team === 'player') return 0.93;                                 // reds may come up to just past the middle
  return Math.min(0.88, 0.6 + levelT * 0.009 + level * 0.03);         // greens creep forward as time passes
}
function clampZone(team, x, y) {
  x = clamp(x, 12, W - 12); y = clamp(y, 34, H - 8);
  const v = diagV(x, y), lim = zoneLimit(team);
  if (team === 'player' && v < lim) { const a = (lim - v) / 2; x += a * W; y += a * H; }
  if (team === 'enemy' && v > lim) { const a = (lim - v) / 2; x += a * W; y += a * H; }
  return [clamp(x, 12, W - 12), clamp(y, 34, H - 8)];
}

// ---------------------------------------------------------------- throwing
const DIAG = (() => { const l = Math.hypot(W, H); return [-W / l, -H / l]; })();
function throwBall(k, power, tx, ty) {
  const sx = k.x + (k.team === 'player' ? -5 : 6), sy = k.y - 2;
  let ex, ey;
  if (tx !== undefined) { ex = tx; ey = ty; }
  else {
    const dist = 55 + power * 470;
    let dir = k.team === 'player' ? DIAG : [-DIAG[0], -DIAG[1]];
    // gentle aim assist: snap toward the enemy closest to the throw line (within ~22 degrees)
    let bestA = 0.38, bestDir = null;
    kids.forEach(o => {
      if (o.team === k.team || !alive(o)) return;
      const dx = o.x - k.x, dy = o.y - k.y, l = Math.hypot(dx, dy) || 1;
      const a = Math.acos(clamp((dx * dir[0] + dy * dir[1]) / l, -1, 1));
      if (a < bestA) { bestA = a; bestDir = [dx / l, dy / l]; }
    });
    if (bestDir) dir = bestDir;
    ex = sx + dir[0] * dist; ey = sy + dir[1] * dist;
  }
  const d = Math.hypot(ex - sx, ey - sy);
  balls.push({ team: k.team, owner: k.id, sx, sy, ex, ey, x: sx, y: sy, z: 22, z0: 22, t: 0,
               T: 0.38 + d / 430, h: 8 + d * 0.13 });
  sfx.throw();
}

function hitKid(k, b) {
  for (let i = 0; i < 9; i++) parts.push({ x: k.x, y: k.y, z: 18, vx: rand(-40, 40), vy: rand(-20, 20), vz: rand(10, 70), r: rand(1, 2.4), life: rand(0.4, 0.8), t: 0 });
  k.hits++; k.hitT = 0.35; k.snowT = 3; sfx.hit();
  if (k.team === 'enemy') score += 1;
  if (k.hits >= 2) ko(k);
  else { k.state = 'sit'; k.t = k.team === 'player' ? 2.6 : 2.2; k.tx = null; if (drag && drag.k === k) drag = null; }
}
function ko(k) {
  k.state = 'down'; k.t = 0; k.tx = null; k.hits = Math.max(k.hits, 2);
  if (k.team === 'enemy') score += 2;
  if (drag && drag.k === k) drag = null;
  const skin = resolveSkin(TEAMS[k.team]);
  // mittens and boots fly off, like the original knockout
  const items = [['mitten', skin.mitten], ['mitten', skin.mitten], ['boot', skin.boots], ['boot', skin.boots], ['hat', skin.suit]];
  items.forEach(([type, col]) => decals.push({ type, col, x: k.x, y: k.y, z: type === 'hat' ? 20 : 8,
    vx: rand(-45, 45) + (k.team === 'enemy' ? -10 : 10), vy: rand(-25, 25), vz: rand(40, 90), rot: rand(0, 6), vr: rand(-8, 8), t: 0 }));
  if (selected === k) selected = players().find(usable) || null;
}

// ---------------------------------------------------------------- update
function update(dt) {
  stateT += dt;
  if (bannerT > 0) bannerT -= dt;
  if (fadeDir) {
    fade += fadeDir * dt * 2.2;
    if (fade >= 1 && fadeDir > 0) { fade = 1; fadeDir = -1; const cb = onFaded; onFaded = null; cb && cb(); }
    if (fade <= 0 && fadeDir < 0) { fade = 0; fadeDir = 0; }
  }
  const playing = state === 'play';
  if (playing) levelT += dt;

  // spawn reinforcements from the top-left corner
  if (playing && enemyQueue > 0) { spawnT -= dt; if (spawnT <= 0) { spawnEnemy(); enemyQueue--; spawnT = rand(4.5, 7) / (1 + level * 0.08); } }

  for (const k of kids) {
    k.anim += dt; if (k.hitT > 0) k.hitT -= dt; if (k.snowT > 0) k.snowT -= dt;
    if (k.state === 'down') { k.t += dt; continue; }
    if (k.state === 'sit') { k.t -= dt; if (k.t <= 0) { k.state = 'idle'; k.aiT = rand(0.8, 1.6); } continue; }
    if (k.state === 'throw') { k.t -= dt; if (k.t <= 0) k.state = 'idle'; }
    // cheering
    if ((state === 'lost' && k.team === 'enemy') || (state === 'clear' && k.team === 'player')) { k.jump += dt; k.state = 'cheer'; continue; }
    // movement
    if (k.tx != null) {
      const dx = k.tx - k.x, dy = k.ty - k.y, d = Math.hypot(dx, dy);
      const sp = (k.team === 'player' ? (k.state === 'charge' ? 95 : 80) : 48 + level * 2);
      if (d < 1.5) { k.x = k.tx; k.y = k.ty; k.tx = null; if (k.state === 'walk') k.state = 'idle'; }
      else { const m = Math.min(d, sp * dt); k.x += dx / d * m; k.y += dy / d * m; if (k.state === 'idle') k.state = 'walk'; }
      if (k.x > 0 && k.y > 0 && k.x < W && k.y < H) pushOutOfForts(k);
    } else if (k.state === 'walk') k.state = 'idle';
    // charging
    if (k.state === 'charge') {
      if (k.team === 'player') k.power = Math.min(1, k.power + dt * 0.85);
      else { k.t -= dt; if (k.t <= 0) { throwBall(k, 0, k.aimX, k.aimY); k.state = 'throw'; k.t = 0.3; k.aiT = rand(1.4, 3.2) / (1 + level * 0.12); } }
    }
    // enemy AI
    if (k.team === 'enemy' && playing && (k.state === 'idle' || k.state === 'walk') && k.tx == null) {
      k.aiT -= dt;
      if (k.aiT <= 0) {
        const targets = players().filter(alive);
        if (targets.length && Math.random() < 0.7) {
          const tg = targets[Math.floor(Math.random() * targets.length)];
          const err = Math.max(8, 34 - level * 4);
          // lead the target a little if he is walking
          let px = tg.x, py = tg.y;
          if (tg.tx != null) { const d = Math.hypot(tg.tx - tg.x, tg.ty - tg.y) || 1; px += (tg.tx - tg.x) / d * 25; py += (tg.ty - tg.y) / d * 25; }
          k.aimX = px + rand(-err, err); k.aimY = py + rand(-err, err) * 0.7;
          k.state = 'charge'; k.t = rand(0.7, 1.1); k.power = 0;
        } else {
          const lim = zoneLimit('enemy');
          for (let tries = 0; tries < 8; tries++) {
            const x = rand(14, W * 0.62), y = rand(36, H * 0.75);
            if (diagV(x, y) <= lim && diagV(x, y) > lim - 0.32) { [k.tx, k.ty] = clampZone('enemy', x, y); break; }
          }
          k.aiT = rand(0.6, 1.6);
        }
      }
    }
  }

  // balls
  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i]; b.t += dt; const u = Math.min(1, b.t / b.T);
    b.x = b.sx + (b.ex - b.sx) * u; b.y = b.sy + (b.ey - b.sy) * u;
    b.z = b.z0 * (1 - u) + 4 * b.h * u * (1 - u);
    let gone = false;
    for (const k of kids) {

// ---------------------------------------------------------------- drawing kids
function kidPose(k) {

function trySprite(skin, pose, k) {

function drawKid(k) {

requestAnimationFrame(frame);

// ---------------------------------------------------------------- public API (skins / testing)
window.SnowCraft = {
  SKINS, TEAMS, POSES,
  /** setSkin('player'|'enemy', 'red' | 'green' | skinObject) */
  setSkin(team, skin) {
    if (typeof skin === 'object') { const key = skin.key || ('custom_' + team); SKINS[key] = { ...SKINS[TEAMS[team]], ...skin }; skin = key; }
    if (!SKINS[skin]) throw new Error('Unknown skin ' + skin);
    TEAMS[team] = skin;
  },
  get state() { return { state, level, score, best, kids: kids.map(k => ({ id: k.id, team: k.team, x: k.x, y: k.y, state: k.state, hits: k.hits })), balls: balls.length, enemyQueue }; },
  debug: {
    start: startGame,
    level(n) { level = n; score = 0; setupLevel(n); setState('play'); },
    koEnemies() { enemyQueue = 0; enemies().forEach(k => alive(k) && ko(k)); },
    koPlayers() { players().forEach(k => alive(k) && ko(k)); },
    throwAt(i, x, y) { const k = players()[i]; if (k) throwBall(k, 0, x, y); },
    step(sec) { for (let t = 0; t < sec; t += 1 / 60) update(1 / 60); render(); },
  },
};
})();
</script>
